<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="588" viewBox="0 0 960 588" class="viz-root" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">PromptWarden: more recall, with a false-positive cost</title>
<desc id="chart-desc">Grouped horizontal bars on one common 0–1 axis. Injection recall: v0.1.0 0.2963, v0.2.0 0.6173; F1: v0.1.0 0.5537, v0.2.0 0.7282; False-positive rate: v0.1.0 0.1167, v0.2.0 0.1667. False-positive rate is worse when higher: benign flags rise from 7 to 10. Full 181 rows include fitting data; descriptive, not an independent generalization estimate. The holdout was inspected during development, not a blind external test. Source: README.md audited benchmark; recorded reports dated 2026-11-17, threshold 0.5. The README provides the full data table and counts.</desc>
<style>
.viz-root {
  color-scheme: light;
  --surface: #fcfcfb;
  --primary: #0b0b0b;
  --secondary: #52514e;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --texture-1: #104281;
  --texture-2: #d95926;
}
@media (prefers-color-scheme: dark) {
  .viz-root {
    color-scheme: dark;
    --surface: #1a1a19;
    --primary: #f0efec;
    --secondary: #c3c2b7;
    --grid: #2c2c2a;
    --baseline: #383835;
    --series-1: #3987e5;
    --series-2: #d95926;
    --texture-1: #9ec5f4;
    --texture-2: #eb6834;
  }
}
text {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  fill: var(--primary);
}
.heading { font-size: 29px; font-weight: 650; }
.metric { font-size: 18px; font-weight: 650; }
.secondary, .version, .tick { fill: var(--secondary); }
.hint, .version, .tick { font-size: 14px; }
.value { font-size: 16px; font-weight: 650; }
.tick, .value { font-variant-numeric: tabular-nums; }
.frame, .tooltip-bg { fill: var(--surface); }
.grid { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: var(--baseline); stroke-width: 1; }
.series-1 { fill: var(--series-1); }
.series-2 { fill: var(--series-2); }
.hit { fill: transparent; }
.bar { outline: none; }
.bar:hover .mark, .bar:focus .mark { opacity: 0.8; }
.bar:focus .hit { stroke: var(--primary); stroke-width: 1; }
.tooltip { visibility: hidden; pointer-events: none; }
.tooltip-bg { stroke: var(--baseline); stroke-width: 1; }
.bar:hover .tooltip, .bar:focus .tooltip { visibility: visible; }
.texture { display: none; pointer-events: none; }
@media print {
  .viz-root {
    color-scheme: light;
    --surface: #fcfcfb;
    --primary: #0b0b0b;
    --secondary: #52514e;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --texture-1: #104281;
    --texture-2: #d95926;
  }
  .texture { display: inline; }
}
@media (forced-colors: active) {
  .viz-root { forced-color-adjust: none; }
  .texture { display: inline; }
}
</style>
