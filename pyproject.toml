[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "promptwarden"
version = "0.1.0"
description = "First-stage scan for prompt injection and sensitive-data leakage."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Balamurugan P G" }]
keywords = ["llm", "prompt-injection", "pii", "guardrail"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
promptwarden = "promptwarden.cli:main"

[project.urls]
Homepage = "https://github.com/balamuruganpg/promptwarden"
Source = "https://github.com/balamuruganpg/promptwarden"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptwarden = ["py.typed", "default_model.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["promptwarden"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/promptwarden"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
